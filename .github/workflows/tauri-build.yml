name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: desktop
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build frontend (Vite)
        working-directory: desktop
        shell: bash
        run: npm run build

      - name: Build Tauri app
        working-directory: desktop
        shell: bash
        run: |
          npx tauri build ${{ matrix.args }} > /tmp/tauri-build.log 2>&1 || true
          echo "## Tauri Build 输出 (最后 80 行)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -n -E "error|Error|cannot find|mismatched|panicked|failed" /tmp/tauri-build.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo "=== 最后 80 行原始输出 ===" >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/tauri-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # 若构建失败则退出非零
          if ! grep -q "Finished.*release" /tmp/tauri-build.log; then
            echo "::error::Tauri build failed - see step summary"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devflow-${{ matrix.platform }}-bundle
          path: |
            desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "DevFlow ${{ github.ref_name }}"
          body: |
            自动构建发布 — DevFlow ${{ github.ref_name }}
            - Web 工作台: Vue3 + Vite + TS + Pinia
            - 后端: NestJS + Prisma + MySQL + Redis
            - 桌面端: Tauri 2.0（macOS / Windows）
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
