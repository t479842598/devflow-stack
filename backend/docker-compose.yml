version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: tech-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: tech_flow
      MYSQL_USER: techflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-techflow123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "techflow", "-p${MYSQL_PASSWORD:-techflow123}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tech-flow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-flow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://techflow:${MYSQL_PASSWORD:-techflow123}@mysql:3306/tech_flow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_please}
      JWT_EXPIRE: 7d
      ADMIN_PWD: ${ADMIN_PWD:-admin12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
